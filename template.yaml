AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Hackathon aggregation site - data collection pipeline

Parameters:
  AlertEmail:
    Type: String
    Description: DLQ alarm notification email (set in samconfig.toml)
  GoogleClientId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /hackathon/google_client_id
  GoogleClientSecret:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /hackathon/google_client_secret

Globals:
  Function:
    Runtime: python3.11
    Timeout: 300
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref HackathonsTable
        SCRAPER_QUEUE_URL: !Ref ScraperQueue
        BEDROCK_QUEUE_URL: !Ref BedrockQueue
        DEDUP_QUEUE_URL: !Ref DeduplicatorQueue
        BEDROCK_REGION: ap-northeast-1

# ─────────────────────────────────────────
# DynamoDB
# ─────────────────────────────────────────
Resources:
  HackathonsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hackathons
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: source_id
          AttributeType: S
        - AttributeName: start_date
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: online_status
          AttributeType: S
        - AttributeName: prize_bucket
          AttributeType: S
      KeySchema:
        - AttributeName: source_id
          KeyType: HASH
        - AttributeName: start_date
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-start_date-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: start_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: online_status-start_date-index
          KeySchema:
            - AttributeName: online_status
              KeyType: HASH
            - AttributeName: start_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: prize_bucket-start_date-index
          KeySchema:
            - AttributeName: prize_bucket
              KeyType: HASH
            - AttributeName: start_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

# ─────────────────────────────────────────
# DynamoDB: ユーザーデータ
# ─────────────────────────────────────────
  UserDataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: hackathon-user-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

# ─────────────────────────────────────────
# Cognito（Google Sign-In のみ、メール取得なし）
# ─────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hackathon-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: picture
          AttributeDataType: String
          Mutable: true
          Required: false

  UserPoolGoogleIdP:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "profile openid"
      AttributeMapping:
        username: sub
        name: name
        picture: picture

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: UserPoolGoogleIdP
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: hackathon-web-client
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - Google
      CallbackURLs:
        - https://hackathon.zzzzico.click/auth/callback
        - http://localhost:3000/auth/callback
      LogoutURLs:
        - https://hackathon.zzzzico.click
        - http://localhost:3000
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: hackathon-zzzzico
      UserPoolId: !Ref UserPool

# ─────────────────────────────────────────
# SQS キュー（SSE暗号化有効）
# ─────────────────────────────────────────
  ScraperQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hackathon-scraper.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScraperDLQ.Arn
        maxReceiveCount: 3

  ScraperDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hackathon-scraper-dlq.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      SqsManagedSseEnabled: true

  BedrockQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hackathon-bedrock
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BedrockDLQ.Arn
        maxReceiveCount: 3

  BedrockDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hackathon-bedrock-dlq
      SqsManagedSseEnabled: true

  DeduplicatorQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: hackathon-deduplicator
      VisibilityTimeout: 60
      SqsManagedSseEnabled: true

# ─────────────────────────────────────────
# IAM ロール（最小権限・役割別）
# ─────────────────────────────────────────

  # 収集系: キューへの送信 + SSMの読み取りのみ
  # (GoogleAlerts は seen# レコード管理のため DynamoDB GetItem/PutItem も必要)
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: collector-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt ScraperQueue.Arn
                  - !GetAtt DeduplicatorQueue.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hackathon/*"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt HackathonsTable.Arn

  # 処理系: キューの受信/削除 + DynamoDB書き込み + Bedrock呼び出し
  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: processor-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt ScraperQueue.Arn
                  - !GetAtt BedrockQueue.Arn
                  - !GetAtt DeduplicatorQueue.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt BedrockQueue.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt HackathonsTable.Arn
                  - !Sub "${HackathonsTable.Arn}/index/*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"

  # ステータス更新系: UPCOMING→PAST のみ
  StatusUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: status-updater-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt HackathonsTable.Arn
                  - !Sub "${HackathonsTable.Arn}/index/*"

  # ユーザーデータ系: UserDataTable のみ読み書き可
  UserDataRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: user-data-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt UserDataTable.Arn

  # API系: DynamoDB読み取りのみ（書き込み不可）
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: api-read-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt HackathonsTable.Arn
                  - !Sub "${HackathonsTable.Arn}/index/*"

# ─────────────────────────────────────────
# Lambda 関数
# ─────────────────────────────────────────
  ConnpassCollector:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-connpass-collector
      CodeUri: lambdas/collectors/connpass/
      Handler: app.handler
      Role: !GetAtt CollectorRole.Arn
      Environment:
        Variables:
          CONNPASS_API_KEY_SSM_NAME: /hackathon/connpass_api_key
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 21 * * ? *)"   # JST 06:00
            ScheduleExpressionTimezone: UTC

  DoorkeeperCollector:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-doorkeeper-collector
      CodeUri: lambdas/collectors/doorkeeper/
      Handler: app.handler
      Role: !GetAtt CollectorRole.Arn
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(5 21 * * ? *)"   # JST 06:05
            ScheduleExpressionTimezone: UTC

  GoogleAlertsCollector:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-google-alerts-collector
      CodeUri: lambdas/collectors/google_alerts/
      Handler: app.handler
      Role: !GetAtt CollectorRole.Arn
      Environment:
        Variables:
          SSM_FEEDS_KEY: /hackathon/google_alerts_feeds
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(10 21 * * ? *)"   # JST 06:10
            ScheduleExpressionTimezone: UTC

  DevpostCollector:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-devpost-collector
      CodeUri: lambdas/collectors/devpost/
      Handler: app.handler
      Role: !GetAtt CollectorRole.Arn
      Events:
        WeeklySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 21 ? * TUE *)"   # JST 水曜 06:00
            ScheduleExpressionTimezone: UTC

  TavilyCollector:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-tavily-collector
      CodeUri: lambdas/collectors/tavily/
      Handler: app.handler
      Role: !GetAtt CollectorRole.Arn
      Environment:
        Variables:
          TAVILY_API_KEY_SSM_NAME: /hackathon/tavily_api_key
      Events:
        WeeklySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 22 ? * MON *)"   # JST 月曜 07:00
            ScheduleExpressionTimezone: UTC

  StatusUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-status-updater
      CodeUri: lambdas/status_updater/
      Handler: app.handler
      Role: !GetAtt StatusUpdaterRole.Arn
      Timeout: 60
      Events:
        DailySchedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 21 * * ? *)"   # JST 06:30
            ScheduleExpressionTimezone: UTC

  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-scraper
      CodeUri: lambdas/scraper/
      Handler: app.handler
      Role: !GetAtt ProcessorRole.Arn
      Timeout: 60
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ScraperQueue.Arn
            BatchSize: 5

  BedrockStructurer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-bedrock-structurer
      CodeUri: lambdas/bedrock_structurer/
      Handler: app.handler
      Role: !GetAtt ProcessorRole.Arn
      Timeout: 120
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt BedrockQueue.Arn
            BatchSize: 1

  DeduplicatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-deduplicator
      CodeUri: lambdas/deduplicator/
      Handler: app.handler
      Role: !GetAtt ProcessorRole.Arn
      Timeout: 60
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DeduplicatorQueue.Arn
            BatchSize: 10

# ─────────────────────────────────────────
# API Gateway + Lambda
# ─────────────────────────────────────────
  HackathonApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: hackathon-api
      StageName: v1
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'https://hackathon.zzzzico.click'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
        DefaultAuthorizer: NONE
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-api
      CodeUri: lambdas/api/
      Handler: app.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 10
      MemorySize: 128
      Events:
        ListHackathons:
          Type: Api
          Properties:
            RestApiId: !Ref HackathonApi
            Path: /hackathons
            Method: GET
        GetHackathon:
          Type: Api
          Properties:
            RestApiId: !Ref HackathonApi
            Path: /hackathons/{source_id}
            Method: GET
        Options:
          Type: Api
          Properties:
            RestApiId: !Ref HackathonApi
            Path: /hackathons
            Method: OPTIONS

  UserDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hackathon-user-data
      CodeUri: lambdas/user_data/
      Handler: app.handler
      Role: !GetAtt UserDataRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USER_DATA_TABLE: !Ref UserDataTable
      Events:
        GetAll:
          Type: Api
          Properties:
            RestApiId: !Ref HackathonApi
            Path: /user/data
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        PostAction:
          Type: Api
          Properties:
            RestApiId: !Ref HackathonApi
            Path: /user/data
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        DeleteAction:
          Type: Api
          Properties:
            RestApiId: !Ref HackathonApi
            Path: /user/data/{sk}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref HackathonApi
            Path: /user/me
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

# ─────────────────────────────────────────
# SNS + CloudWatch Alarms（DLQ監視）
# ─────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: hackathon-alerts
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  ScraperDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: hackathon-scraper-dlq-not-empty
      AlarmDescription: ScraperDLQ にメッセージが溜まっています
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScraperDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  BedrockDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: hackathon-bedrock-dlq-not-empty
      AlarmDescription: BedrockDLQ にメッセージが溜まっています
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt BedrockDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

# ─────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────
Outputs:
  HackathonsTableName:
    Value: !Ref HackathonsTable
  ScraperQueueUrl:
    Value: !Ref ScraperQueue
  BedrockQueueUrl:
    Value: !Ref BedrockQueue
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${HackathonApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
  UserPoolId:
    Description: Cognito User Pool ID (set as NEXT_PUBLIC_COGNITO_USER_POOL_ID in Amplify)
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID (set as NEXT_PUBLIC_COGNITO_CLIENT_ID in Amplify)
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Cognito Hosted UI domain (set as NEXT_PUBLIC_COGNITO_DOMAIN in Amplify)
    Value: !Sub "hackathon-zzzzico.auth.${AWS::Region}.amazoncognito.com"
